[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yebit-lyrics-api"
version = "0.1.0"
description = "Yebit local lyrics lookup API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
subtitles = ["openai>=1.40,<3"]

[tool.setuptools]
py-modules = ["main", "subtitle_lyrics"]
packages = ["subtitle_preview"]

[tool.setuptools.package-data]
subtitle_preview = ["index.html"]
