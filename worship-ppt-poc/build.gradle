plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.select'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 기존 찬양 PPT와 파일 가져오기에 필요한 의존성
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    runtimeOnly 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'org.apache.commons:commons-csv:1.12.0'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

application { mainClass = 'org.localchurch.worship.web.LocalWeb' }

tasks.register('frontendBuild', Exec) {
    workingDir 'frontend'
    inputs.files(fileTree('frontend') { exclude 'node_modules/**', 'dist/**', '.taste-skill/**' })
    outputs.dir('frontend/dist')
    commandLine 'npm', 'run', 'build'
}

tasks.named('processResources') {
    dependsOn tasks.named('frontendBuild')
    from('frontend/dist') { into 'static' }
}

// 관리자가 수동으로 실행하는 이전 도구는 앱 배포물에서 제외한다.
sourceSets.test.java.srcDir('src/tools/java')


tasks.register('localSong', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.localchurch.worship.song.repository.SongStore'
    standardInput = System.in
    if (project.hasProperty('songArgs')) args project.property('songArgs').split('\\|', -1)
}

tasks.register('localSongCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.song.LocalSongCheck'
}

tasks.register('localWeb', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.localchurch.worship.web.LocalWeb'
    if (project.hasProperty('dbPath')) args project.property('dbPath')
}

tasks.register('localWebBundle', Sync) {
    dependsOn jar
    into layout.buildDirectory.dir('local-web/lib')
    from configurations.runtimeClasspath
    from tasks.jar
}

tasks.register('songRequestsCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.song.SongRequestsCheck'
}

tasks.register('mysqlEndToEndCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.database.MySqlEndToEndCheck'
}

tasks.register('batchImport', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.localchurch.worship.importer.BatchImport'
    if (project.hasProperty('batchArgs')) args project.property('batchArgs').split('\\|', -1)
}

tasks.register('batchImportCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.importer.BatchImportCheck'
}

tasks.register('youthCatalog', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.localchurch.worship.catalog.YouthCatalog'
    args 'catalog/youth-chart-candidates.json'
}

tasks.register('youthCatalogCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.catalog.YouthCatalogCheck'
}

tasks.register('hymnImport', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.importer.HymnImport'
    if (project.hasProperty('hymnArgs')) args project.property('hymnArgs').split('\\|', -1)
}
tasks.register('hymnImportCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.importer.HymnImportCheck'
}

tasks.register('hymnLyricsImport', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.importer.HymnLyricsImport'
    if (project.hasProperty('hymnLyricsArgs')) args project.property('hymnLyricsArgs').split('\\|', -1)
}
tasks.register('hymnLyricsCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.importer.HymnLyricsCheck'
}
tasks.register('pptBatchCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.localchurch.worship.ppt.PptBatchCheck'
}
distributions {
    main {
        contents {
            from('README-배포.md')
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}
